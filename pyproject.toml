[project]
name = "nass-payment"
version = "0.1.1"
description = "Nass Payment Gateway for Django: card payments on Nass's 3-D Secure page that complete a receipt once Nass confirms them."
readme = "README.md"
authors = [
    { name = "Brwa Atta", email = "brwa.ata.hamalaw@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["nass", "payment", "gateway", "3-d secure", "django", "iraq"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/brwa-ata/nass-payment"
Repository = "https://github.com/brwa-ata/nass-payment"
Changelog = "https://github.com/brwa-ata/nass-payment/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
# README examples are laid out by hand; formatting them would mangle them
extend-exclude = ["*.md"]

[tool.ruff.lint]
# DRF declares permission_classes / authentication_classes as class-level
# lists; that is the framework's own idiom, not shared mutable state
ignore = ["RUF012"]

[tool.ruff.format]
quote-style = "single"
